<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Preview — Half Lens</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background: #0a0f1a; color: #f0f4ff; min-height: 100vh; }
.toolbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px; padding: 12px 20px;
  background: rgba(7,20,45,0.95); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-wrap: wrap;
}
.toolbar h1 { font-size: 14px; font-weight: 700; margin-left: auto; color: #60a5fa; }
.tab-btn {
  padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
  color: rgba(200,215,255,0.6); cursor: pointer; transition: all 0.2s;
  font-family: 'Cairo', sans-serif; white-space: nowrap;
}
.tab-btn:hover { background: rgba(255,255,255,0.08); color: #f0f4ff; }
.tab-btn.active { background: rgba(37,99,235,0.15); border-color: rgba(37,99,235,0.3); color: #60a5fa; }
.preview-frame { max-width: 700px; margin: 24px auto; padding: 0 16px; }
.preview-frame iframe {
  width: 100%; height: 850px; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; background: #030b1a;
}
.badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-right: 6px; }
.badge-blue { background: rgba(37,99,235,0.15); color: #60a5fa; }
.badge-green { background: rgba(16,185,129,0.15); color: #34d399; }
.badge-red { background: rgba(239,68,68,0.15); color: #f87171; }
.badge-amber { background: rgba(245,158,11,0.15); color: #fbbf24; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>📧 Email Preview</h1>
  <button class="tab-btn active" onclick="show('otp',this)"><span class="badge badge-blue">OTP</span>رمز التحقق</button>
  <button class="tab-btn" onclick="show('registration',this)"><span class="badge badge-blue">استلام</span>تأكيد التسجيل</button>
  <button class="tab-btn" onclick="show('approved',this)"><span class="badge badge-green">قبول</span>تمت الموافقة</button>
  <button class="tab-btn" onclick="show('rejected',this)"><span class="badge badge-red">رفض</span>لم تتم الموافقة</button>
  <button class="tab-btn" onclick="show('revision',this)"><span class="badge badge-amber">تعديل</span>تعديلات مطلوبة</button>
  <button class="tab-btn" onclick="show('resubmitted',this)"><span class="badge badge-blue">إعادة</span>إعادة التقديم</button>
</div>

<div class="preview-frame">
  <iframe id="emailFrame" srcdoc="" sandbox="allow-same-origin"></iframe>
</div>

<script>
// ── Sample data ──
const LOGO = '/assets/logo-white.png';
const BASE = '#';
const S = {
  name: 'أحمد المطيري',
  email: 'ahmed@company.com',
  otp: '8472',
  date: '16 مارس 2026',
  time: '14:32 — 16 مارس 2026',
  device: 'Chrome — macOS',
  reason: 'المستندات المرفقة غير واضحة — يرجى رفع نسخة أوضح من السجل التجاري والهوية الوطنية',
  loginUrl: '#',
};

// ══════════════════════════════════════════════════════════
// These functions are EXACT copies of the edge function helpers
// ══════════════════════════════════════════════════════════

function baseHeader(badge, badgeBg, badgeBorder, badgeColor) {
  return `
  <tr>
    <td align="center" style="background:linear-gradient(180deg,#04081a 0%,#0a1628 100%);padding:32px 32px 24px;">
      <img src="${LOGO}" alt="Half Lens" width="160" style="display:block;margin:0 auto 16px auto;border:0;max-width:160px;height:auto;" />
      <div style="margin-top:16px;">
        <span style="display:inline-block;padding:6px 18px;background:${badgeBg};border:1px solid ${badgeBorder};border-radius:20px;font-size:13px;font-weight:700;color:${badgeColor};">${badge}</span>
      </div>
    </td>
  </tr>`;
}

function baseFooter() {
  return `
  <tr>
    <td align="center" style="background:#040910;padding:24px 32px;border-top:1px solid rgba(255,255,255,0.05);">
      <img src="${LOGO}" alt="Half Lens" width="100" style="display:block;margin:0 auto;border:0;max-width:100px;height:auto;opacity:0.35;" />
      <div style="margin-top:12px;font-size:11px;color:rgba(200,215,255,0.3);line-height:2;">
        <a href="${BASE}" style="color:rgba(200,215,255,0.4);text-decoration:none;margin:0 8px;">الموقع الالكتروني</a>
        <a href="${BASE}/privacy" style="color:rgba(200,215,255,0.4);text-decoration:none;margin:0 8px;">سياسة الخصوصية</a>
        <a href="${BASE}/terms" style="color:rgba(200,215,255,0.4);text-decoration:none;margin:0 8px;">الشروط والأحكام</a>
      </div>
      <p style="font-size:10px;color:rgba(200,215,255,0.2);margin:8px 0 0;">Half Lens &copy; 2026 — جميع الحقوق محفوظة</p>
    </td>
  </tr>`;
}

function wrapTemplate(content, title) {
  return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title}</title>
</head>
<body style="margin:0;padding:0;background-color:#030b1a;font-family:'Cairo',Arial,'Segoe UI',Tahoma,sans-serif;direction:rtl;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#030b1a;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#060d1e;border-radius:8px;overflow:hidden;">
          ${content}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>`;
}

function infoBox(rows) {
  const rowsHtml = rows.map((r, i) => `
      <tr>
        <td style="padding:12px 18px;${i < rows.length - 1 ? 'border-bottom:1px solid rgba(255,255,255,0.05);' : ''}font-size:12px;color:rgba(200,215,255,0.5);font-weight:600;width:140px;">
          ${r.label}
        </td>
        <td style="padding:12px 18px;${i < rows.length - 1 ? 'border-bottom:1px solid rgba(255,255,255,0.05);' : ''}font-size:12px;color:rgba(200,215,255,0.8);font-weight:600;text-align:left;" dir="rtl">
          ${r.value}
        </td>
      </tr>`).join('');

  return `
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid rgba(255,255,255,0.08);border-radius:10px;margin-bottom:24px;">
    <tr>
      <td style="padding:0;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
          ${rowsHtml}
        </table>
      </td>
    </tr>
  </table>`;
}

function ctaButton(text, url, color) {
  color = color || '#2563eb';
  return `
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:24px;">
    <tr>
      <td align="center">
        <a href="${url}" style="display:inline-block;padding:14px 40px;background:linear-gradient(135deg,${color} 0%,${color}dd 100%);color:#ffffff;font-size:14px;font-weight:700;border-radius:10px;text-decoration:none;box-shadow:0 4px 15px ${color}4d;">
          ${text}
        </a>
      </td>
    </tr>
  </table>`;
}

function alertBox(text, bgColor, borderColor, textColor) {
  return `
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:${bgColor};border:1px solid ${borderColor};border-radius:10px;margin-bottom:24px;">
    <tr>
      <td style="padding:14px 18px;font-size:12px;line-height:1.7;color:${textColor};">
        ${text}
      </td>
    </tr>
  </table>`;
}

// ══════════════════════════════════════════════════════════
// Email builders — EXACT match to edge functions
// ══════════════════════════════════════════════════════════

const templates = {

  // ── OTP (from send-otp-email/index.ts getEmailTemplate) ──
  otp() {
    const digits = S.otp.split('');
    const otpCell = (d) => `<td align="center" valign="middle" width="58" height="64" style="width:58px;height:64px;background:rgba(37,99,235,0.06);border:1.5px solid rgba(37,99,235,0.3);border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:#60a5fa;">${d}</td>`;
    const gap = `<td width="10" style="width:10px;"></td>`;

    return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رمز التحقق - Half Lens</title>
</head>
<body style="margin:0;padding:0;background-color:#030b1a;font-family:'Cairo',Arial,'Segoe UI',Tahoma,sans-serif;direction:rtl;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#030b1a;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#060d1e;border-radius:8px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="background:linear-gradient(180deg,#04081a 0%,#0a1628 100%);padding:32px 32px 24px;">
              <img src="${LOGO}" alt="Half Lens" width="160" style="display:block;margin:0 auto 16px auto;border:0;max-width:160px;height:auto;" />
              <div style="margin-top:16px;">
                <span style="display:inline-block;padding:6px 18px;background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.25);border-radius:20px;font-size:13px;font-weight:700;color:#60a5fa;">&#128272; رمز التحقق</span>
              </div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px 32px 0;color:#f0f4ff;">
              <p style="font-size:18px;font-weight:700;color:#f0f4ff;margin:0 0 8px;">مرحباً ${S.name} &#128075;</p>
              <p style="font-size:14px;color:rgba(200,215,255,0.6);line-height:1.8;margin:0 0 24px;">تم طلب رمز تحقق لتسجيل الدخول إلى منصة Half Lens. استخدم الرمز التالي:</p>
            </td>
          </tr>

          <!-- OTP Boxes -->
          <tr>
            <td style="padding:0 32px;text-align:center;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" dir="ltr" style="margin:0 auto;">
                <tr>${otpCell(digits[0])}${gap}${otpCell(digits[1])}${gap}${otpCell(digits[2])}${gap}${otpCell(digits[3])}</tr>
              </table>
            </td>
          </tr>

          <!-- Expiry -->
          <tr>
            <td style="padding:18px 32px 0;text-align:center;">
              <p style="font-size:13px;color:rgba(200,215,255,0.5);margin:0;">&#9201;&#65039; ينتهي هذا الرمز خلال <strong style="color:rgba(200,215,255,0.8);">10 دقائق</strong></p>
            </td>
          </tr>

          <!-- Info Row -->
          <tr>
            <td style="padding:20px 32px 0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid rgba(255,255,255,0.08);border-radius:10px;">
                <tr>
                  <td style="padding:12px 18px;font-size:12px;color:rgba(200,215,255,0.5);border-bottom:1px solid rgba(255,255,255,0.05);">&#128338; وقت الطلب</td>
                  <td style="padding:12px 18px;font-size:12px;color:rgba(200,215,255,0.8);font-weight:600;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05);" dir="rtl">${S.time}</td>
                </tr>
                <tr>
                  <td style="padding:12px 18px;font-size:12px;color:rgba(200,215,255,0.5);border-bottom:1px solid rgba(255,255,255,0.05);">&#128231; البريد</td>
                  <td style="padding:12px 18px;font-size:12px;color:rgba(200,215,255,0.8);font-weight:600;text-align:left;" dir="ltr">${S.email}</td>
                </tr>
                <tr>
                  <td style="padding:12px 18px;font-size:12px;color:rgba(200,215,255,0.5);">&#128187; الجهاز</td>
                  <td style="padding:12px 18px;font-size:12px;color:rgba(200,215,255,0.8);font-weight:600;text-align:left;" dir="ltr">${S.device}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Warning -->
          <tr>
            <td style="padding:18px 32px 0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid rgba(245,158,11,0.3);background:rgba(245,158,11,0.05);border-radius:10px;">
                <tr>
                  <td style="padding:14px 18px;font-size:12px;color:#fbbf24;line-height:1.7;">
                    &#9888;&#65039; لا تشارك هذا الرمز مع أي شخص. فريق Half Lens لن يطلب منك رمز التحقق أبداً عبر الهاتف أو البريد.
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CTA Button -->
          <tr>
            <td style="padding:24px 32px;text-align:center;">
              <a href="${S.loginUrl}" style="display:inline-block;padding:14px 40px;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#ffffff;font-size:14px;font-weight:700;border-radius:10px;text-decoration:none;box-shadow:0 4px 15px rgba(37,99,235,0.3);">&#127760; الذهاب إلى صفحة تسجيل الدخول</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background:#040910;padding:24px 32px;border-top:1px solid rgba(255,255,255,0.05);">
              <img src="${LOGO}" alt="Half Lens" width="100" style="display:block;margin:0 auto;border:0;max-width:100px;height:auto;opacity:0.35;" />
              <div style="margin-top:12px;font-size:11px;color:rgba(200,215,255,0.3);line-height:2;">
                <a href="${BASE}" style="color:rgba(200,215,255,0.4);text-decoration:none;margin:0 8px;">الموقع الالكتروني</a>
                <a href="${BASE}/privacy" style="color:rgba(200,215,255,0.4);text-decoration:none;margin:0 8px;">سياسة الخصوصية</a>
                <a href="${BASE}/terms" style="color:rgba(200,215,255,0.4);text-decoration:none;margin:0 8px;">الشروط والأحكام</a>
              </div>
              <p style="font-size:10px;color:rgba(200,215,255,0.2);margin:8px 0 0;">Half Lens &copy; 2026 — جميع الحقوق محفوظة</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>`;
  },

  // ── Registration Received (from buildRegistrationReceived) ──
  registration() {
    const content = `
    ${baseHeader('&#128230; تم استلام الطلب', 'rgba(37,99,235,0.12)', 'rgba(37,99,235,0.25)', '#60a5fa')}
    <tr>
      <td style="padding:32px 32px 0;color:#f0f4ff;">
        <p style="font-size:18px;font-weight:700;color:#f0f4ff;margin:0 0 8px;">مرحباً ${S.name} &#128075;</p>
        <p style="font-size:14px;color:rgba(200,215,255,0.6);line-height:1.8;margin:0 0 24px;">شكراً لتسجيلك في منصة Half Lens. تم استلام طلبك بنجاح وهو الآن قيد المراجعة من قبل فريقنا.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 28px;">
        ${infoBox([
          { label: '&#128203; حالة الطلب', value: 'قيد المراجعة' },
          { label: '&#128197; تاريخ التقديم', value: S.date },
          { label: '&#128231; البريد الإلكتروني', value: S.email },
        ])}
        ${alertBox(
          '&#9203;&#65039; سيتم إشعارك عبر البريد الإلكتروني بمجرد مراجعة طلبك. عادةً ما تتم المراجعة خلال 1-3 أيام عمل.',
          'rgba(245,158,11,0.05)',
          'rgba(245,158,11,0.3)',
          '#fbbf24'
        )}
      </td>
    </tr>
    ${baseFooter()}`;
    return wrapTemplate(content, 'تأكيد استلام طلب التسجيل - Half Lens');
  },

  // ── Approved (from buildApproved) ──
  approved() {
    const content = `
    ${baseHeader('&#9989; تمت الموافقة', 'rgba(16,185,129,0.12)', 'rgba(16,185,129,0.25)', '#34d399')}
    <tr>
      <td style="padding:32px 32px 0;text-align:center;color:#f0f4ff;">
        <div style="display:inline-block;width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);line-height:64px;font-size:28px;margin-bottom:20px;">&#10003;</div>
        <p style="font-size:20px;font-weight:700;color:#f0f4ff;margin:0 0 12px;">تم اعتماد حسابك!</p>
        <p style="font-size:14px;color:rgba(200,215,255,0.6);line-height:1.8;margin:0 0 24px;">مرحباً ${S.name}، يسعدنا إبلاغك بأن حسابك على منصة Half Lens قد تم اعتماده بنجاح.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 28px;">
        <p style="font-size:14px;font-weight:600;color:#f0f4ff;margin:0 0 12px;">ما الخطوة التالية؟</p>
        <ul style="margin:0;padding:0 18px;font-size:14px;color:rgba(200,215,255,0.6);line-height:2.2;">
          <li>سجّل الدخول عبر بريدك الالكتروني المسجل لاستعراض لوحة التحكم الخاصة بك</li>
          <li>أكمل ملفك الشخصي وأضف رابط البورتفوليو لزيادة فرص ترشيحك</li>
          <li>تأكد من تحديث خدماتك وأسعارك لاستقبال المشاريع المناسبة</li>

        </ul>
        ${ctaButton('الدخول إلى حسابي', S.loginUrl, '#10b981')}
      </td>
    </tr>
    ${baseFooter()}`;
    return wrapTemplate(content, 'تمت الموافقة على طلب التسجيل - Half Lens');
  },

  // ── Rejected (from buildRejected) ──
  rejected() {
    const content = `
    ${baseHeader('&#10060; لم تتم الموافقة', 'rgba(239,68,68,0.1)', 'rgba(239,68,68,0.25)', '#f87171')}
    <tr>
      <td style="padding:32px 32px 0;text-align:center;color:#f0f4ff;">
        <div style="display:inline-block;width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);line-height:64px;font-size:28px;margin-bottom:20px;">&#10060;</div>
        <p style="font-size:20px;font-weight:700;color:#f0f4ff;margin:0 0 12px;">لم تتم الموافقة على طلبك</p>
        <p style="font-size:14px;color:rgba(200,215,255,0.6);line-height:1.8;margin:0 0 24px;">مرحباً ${S.name}، نأسف لإبلاغك بأن طلب التسجيل الخاص بك لم تتم الموافقة عليه في الوقت الحالي.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 24px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:10px;margin-bottom:24px;">
          <tr>
            <td style="padding:16px 20px;">
              <p style="font-size:13px;font-weight:600;color:#f87171;margin:0 0 8px;">سبب الرفض:</p>
              <p style="font-size:14px;color:rgba(200,215,255,0.7);line-height:1.8;margin:0;">${S.reason}</p>
            </td>
          </tr>
        </table>
        <p style="font-size:13px;color:rgba(200,215,255,0.4);line-height:1.8;margin:0;">إذا كنت تعتقد أن هذا القرار تم بالخطأ أو لديك استفسار، يرجى التواصل مع فريق الدعم.</p>
      </td>
    </tr>
    ${baseFooter()}`;
    return wrapTemplate(content, 'تحديث بشأن طلب التسجيل - Half Lens');
  },

  // ── Revision Requested (from buildRevisionRequested) ──
  revision() {
    const content = `
    ${baseHeader('&#9888;&#65039; تعديلات مطلوبة', 'rgba(245,158,11,0.1)', 'rgba(245,158,11,0.25)', '#fbbf24')}
    <tr>
      <td style="padding:32px 32px 0;text-align:center;color:#f0f4ff;">
        <div style="display:inline-block;width:64px;height:64px;border-radius:50%;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);line-height:64px;font-size:28px;margin-bottom:20px;">&#9888;</div>
        <p style="font-size:20px;font-weight:700;color:#f0f4ff;margin:0 0 12px;">حسابك يحتاج تعديلات</p>
        <p style="font-size:14px;color:rgba(200,215,255,0.6);line-height:1.8;margin:0 0 24px;">مرحباً ${S.name}، تمت مراجعة طلبك وهناك بعض البيانات التي تحتاج إلى تعديل قبل إتمام الموافقة.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 28px;">
        ${alertBox(
          '<strong>ملاحظات المراجع:</strong><br/>' + S.reason,
          'rgba(245,158,11,0.05)',
          'rgba(245,158,11,0.3)',
          '#fbbf24'
        )}
        ${ctaButton('تسجيل الدخول وتعديل البيانات', S.loginUrl, '#2563eb')}
        <p style="font-size:13px;color:rgba(200,215,255,0.4);line-height:1.8;margin:16px 0 0;text-align:center;">
          بعد إجراء التعديلات المطلوبة، اضغط على "إعادة تقديم الطلب" لإرسال طلبك مرة أخرى للمراجعة.
        </p>
      </td>
    </tr>
    ${baseFooter()}`;
    return wrapTemplate(content, 'مطلوب تعديلات على طلب التسجيل - Half Lens');
  },

  // ── Resubmitted (from buildResubmitted) ──
  resubmitted() {
    const content = `
    ${baseHeader('&#128260; تم إعادة التقديم', 'rgba(37,99,235,0.12)', 'rgba(37,99,235,0.25)', '#60a5fa')}
    <tr>
      <td style="padding:32px 32px 0;color:#f0f4ff;">
        <p style="font-size:18px;font-weight:700;color:#f0f4ff;margin:0 0 8px;">مرحباً ${S.name} &#128075;</p>
        <p style="font-size:14px;color:rgba(200,215,255,0.6);line-height:1.8;margin:0 0 24px;">تم إعادة تقديم طلب التسجيل الخاص بك بنجاح وهو الآن قيد المراجعة مرة أخرى.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 28px;">
        ${infoBox([
          { label: '&#128203; حالة الطلب', value: 'قيد المراجعة' },
          { label: '&#128197; تاريخ إعادة التقديم', value: S.date },
          { label: '&#128231; البريد الإلكتروني', value: S.email },
        ])}
        ${alertBox(
          '&#9203;&#65039; سيتم إشعارك عبر البريد الإلكتروني بمجرد مراجعة طلبك.',
          'rgba(245,158,11,0.05)',
          'rgba(245,158,11,0.3)',
          '#fbbf24'
        )}
      </td>
    </tr>
    ${baseFooter()}`;
    return wrapTemplate(content, 'تم إعادة تقديم طلب التسجيل - Half Lens');
  },
};

function show(type, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('emailFrame').srcdoc = templates[type]();
}

// Init
show('otp', document.querySelector('.tab-btn'));
</script>
</body>
