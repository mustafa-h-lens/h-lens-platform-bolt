<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Preview — Half Lens</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #0a0f1a;
    color: #f0f4ff;
    min-height: 100vh;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    padding: 14px 22px;
    background: rgba(7,20,45,0.96);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 14px; font-weight: 700; color: #60a5fa; margin-left: auto; }
  .tab-btn {
    padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: rgba(200,215,255,0.65);
    cursor: pointer; transition: all 0.15s;
    font-family: 'Cairo', sans-serif; white-space: nowrap;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.08); color: #f0f4ff; }
  .tab-btn.active {
    background: rgba(37,99,235,0.18);
    border-color: rgba(37,99,235,0.4);
    color: #60a5fa;
  }
  .toggle {
    padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: rgba(200,215,255,0.65);
    cursor: pointer; transition: all 0.15s;
    font-family: 'Cairo', sans-serif; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .toggle.on {
    background: rgba(245,158,11,0.18);
    border-color: rgba(245,158,11,0.45);
    color: #fbbf24;
  }
  .toggle .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(200,215,255,0.35);
  }
  .toggle.on .dot { background: #fbbf24; }
  .badge {
    font-size: 10px; padding: 2px 8px; border-radius: 20px;
    margin-right: 6px; font-weight: 700;
  }
  .badge-blue   { background: rgba(37,99,235,0.18);  color: #60a5fa; }
  .badge-green  { background: rgba(16,185,129,0.18); color: #34d399; }
  .badge-red    { background: rgba(239,68,68,0.18);  color: #f87171; }
  .badge-amber  { background: rgba(245,158,11,0.18); color: #fbbf24; }
  .badge-purple { background: rgba(139,92,246,0.18); color: #a78bfa; }

  .preview-wrap { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .preview-info {
    font-size: 12px; color: rgba(200,215,255,0.55);
    text-align: center; margin-bottom: 12px;
  }
  .preview-info b { color: #60a5fa; }
  iframe.preview-frame {
    width: 100%; height: 1100px; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    background: #f4f6fb;
    transition: filter 0.2s;
  }
  iframe.preview-frame.invert { filter: invert(1) hue-rotate(180deg); }
</style>
</head>
<body>

<div class="toolbar">
  <button class="tab-btn active" data-tpl="otp">              <span class="badge badge-blue">OTP</span>رمز التحقق</button>
  <button class="tab-btn"        data-tpl="invite_client">    <span class="badge badge-green">عميل</span>دعوة عميل</button>
  <button class="tab-btn"        data-tpl="registration">    <span class="badge badge-blue">استلام</span>تأكيد التسجيل</button>
  <button class="tab-btn"        data-tpl="approved">         <span class="badge badge-green">قبول</span>تمت الموافقة</button>
  <button class="tab-btn"        data-tpl="account_created">  <span class="badge badge-green">إنشاء</span>إنشاء حساب</button>
  <button class="tab-btn"        data-tpl="rejected">         <span class="badge badge-red">رفض</span>لم تتم الموافقة</button>
  <button class="tab-btn"        data-tpl="revision">         <span class="badge badge-amber">تعديل</span>تعديلات مطلوبة</button>
  <button class="tab-btn"        data-tpl="resubmitted">      <span class="badge badge-blue">إعادة</span>إعادة التقديم</button>
  <button class="tab-btn"        data-tpl="email_changed">    <span class="badge badge-blue">بريد</span>تغيير البريد</button>
  <button class="tab-btn"        data-tpl="admin_new">        <span class="badge badge-purple">إدارة</span>طلب جديد</button>
  <button class="tab-btn"        data-tpl="user_update">      <span class="badge badge-blue">تحديث</span>تحديث المستخدم</button>

  <button class="toggle" id="tgDark"><span class="dot"></span>Dark mode</button>
  <button class="toggle" id="tgInvert"><span class="dot"></span>iOS invert</button>

  <h1>📧 Email Preview</h1>
</div>

<div class="preview-wrap">
  <div class="preview-info">
    Live render of the unified email template system. Click <b>Dark mode</b> to simulate <code>@media (prefers-color-scheme: dark)</code>, or <b>iOS invert</b> to see what iOS Mail does to a light-mode email.
  </div>
  <iframe id="emailFrame" class="preview-frame" srcdoc=""></iframe>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  PORT of supabase/functions/_shared/email/{theme,components,builder}.ts
//  Keep in sync with the Deno source. Same component HTML strings,
//  same parameter names — just no Deno-specific bits.
// ════════════════════════════════════════════════════════════════

// ── Theme ─────────────────────────────────────────────────────
const PALETTE = {
  light: {
    pageBg:'#f4f6fb', cardBg:'#ffffff', border:'#e2e8f0', divider:'#eef2f7', soft:'#f8fafc',
    text:'#0f172a', body:'#334155', muted:'#64748b', subtle:'#94a3b8',
    link:'#2563eb',
  },
  dark: {
    pageBg:'#0a1024', cardBg:'#0d1428', border:'#1e293b', divider:'#1a2236', soft:'#0a1838',
    text:'#f8fafc', body:'#cbd5e1', muted:'#94a3b8', subtle:'#64748b',
    link:'#60a5fa',
  },
};
const STATUS_COLORS = {
  info:    { textLight:'#1d4ed8', textDark:'#60a5fa', pillBgLight:'#eff6ff', pillBgDark:'#0a1838', border:'#3b82f6', iconCircleBgLight:'#eff6ff', iconCircleBgDark:'#0a1838' },
  success: { textLight:'#047857', textDark:'#34d399', pillBgLight:'#ecfdf5', pillBgDark:'#022c22', border:'#10b981', iconCircleBgLight:'#ecfdf5', iconCircleBgDark:'#022c22' },
  warning: { textLight:'#b45309', textDark:'#fbbf24', pillBgLight:'#fffbeb', pillBgDark:'#2a1d05', border:'#f59e0b', iconCircleBgLight:'#fffbeb', iconCircleBgDark:'#2a1d05' },
  danger:  { textLight:'#b91c1c', textDark:'#f87171', pillBgLight:'#fef2f2', pillBgDark:'#2c0a0a', border:'#ef4444', iconCircleBgLight:'#fef2f2', iconCircleBgDark:'#2c0a0a' },
};
const DIFF = { oldLight:'#b91c1c', newLight:'#047857', oldDark:'#fca5a5', newDark:'#86efac' };
const FONT_STACK = "'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif";
const RADII = { card:'16px', control:'12px', pill:'999px' };
const SIZES = { h1:'22px', h2:'16px', body:'14px', small:'12px', tiny:'11px' };

// Local-served logo URLs (preview only). Production reads from Supabase Storage.
const LOGOS = {
  light:   '/assets/email/logo-on-white.png',
  light2x: '/assets/email/logo-on-white@2x.png',
  dark:    '/assets/email/logo-on-dark.png',
  dark2x:  '/assets/email/logo-on-dark@2x.png',
};
const SITE = '#';

// ── Helpers ───────────────────────────────────────────────────
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function preheader(text) {
  const safe = escapeHtml(text);
  const pad = ' &zwnj; &nbsp;'.repeat(40);
  return `<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;color:#f4f6fb;">${safe}${pad}</div>`;
}
function ltrSpan(s) { return `<span dir="ltr" style="unicode-bidi:isolate;">${escapeHtml(s)}</span>`; }

// ── Components ────────────────────────────────────────────────
function renderParagraph(text, muted=false) {
  const colorLight = muted ? PALETTE.light.muted : PALETTE.light.body;
  const sz = muted ? SIZES.small : SIZES.body;
  const cls = muted ? 'e-mute' : 'e-body';
  return `<tr><td class="e-pad" style="padding:0 32px 16px;">
    <p class="${cls}" style="margin:0;color:${colorLight};font-size:${sz};line-height:1.85;font-family:${FONT_STACK};">${escapeHtml(text)}</p>
  </td></tr>`;
}
function renderHeading(text) {
  return `<tr><td class="e-pad" style="padding:8px 32px 12px;">
    <h2 class="e-h1" style="margin:0;color:${PALETTE.light.text};font-size:${SIZES.h2};line-height:1.5;font-weight:700;font-family:${FONT_STACK};">${escapeHtml(text)}</h2>
  </td></tr>`;
}
function renderInfoBox(rows) {
  const rowsHtml = rows.map((row, i) => {
    const isLast = i === rows.length - 1;
    const styles = [
      `color:${PALETTE.light.text}`, `font-size:${SIZES.body}`, 'font-weight:600',
      row.strike ? 'text-decoration:line-through;text-decoration-thickness:2px;color:#b91c1c' : '',
    ].filter(Boolean).join(';');
    const valueHtml = row.ltr ? ltrSpan(row.value) : escapeHtml(row.value);
    return `<tr>
      <td class="e-mute ib-label" style="padding:12px 16px;color:${PALETTE.light.muted};font-size:${SIZES.small};font-family:${FONT_STACK};white-space:nowrap;${isLast?'':`border-bottom:1px solid ${PALETTE.light.divider};`}">${escapeHtml(row.label)}</td>
      <td class="e-h1 ib-value" align="left" style="padding:12px 16px;${styles};font-family:${FONT_STACK};${isLast?'':`border-bottom:1px solid ${PALETTE.light.divider};`}">${valueHtml}</td>
    </tr>`;
  }).join('');
  return `<tr><td class="e-pad" style="padding:6px 32px 16px;">
    <table role="presentation" class="e-infobox" width="100%" cellspacing="0" cellpadding="0" border="0"
           style="border:1px solid ${PALETTE.light.border};border-radius:${RADII.control};background:${PALETTE.light.soft};border-collapse:separate;">
      ${rowsHtml}
    </table>
  </td></tr>`;
}
function renderAlertBox(text, status='info', title) {
  const c = STATUS_COLORS[status];
  const titleHtml = title ? `<p style="margin:0 0 6px;color:${c.textLight};font-weight:700;font-size:${SIZES.body};font-family:${FONT_STACK};">${escapeHtml(title)}</p>` : '';
  return `<tr><td class="e-pad" style="padding:0 32px 16px;">
    <table role="presentation" class="e-alert e-alert-${status}" width="100%" cellspacing="0" cellpadding="0" border="0"
           style="background:${c.pillBgLight};border:1px solid ${c.border};border-radius:${RADII.control};">
      <tr><td style="padding:14px 16px;">
        ${titleHtml}
        <p class="e-body" style="margin:0;color:${PALETTE.light.body};font-size:${SIZES.body};line-height:1.85;font-family:${FONT_STACK};white-space:pre-wrap;overflow-wrap:anywhere;">${escapeHtml(text)}</p>
      </td></tr>
    </table>
  </td></tr>`;
}
function renderList(items, ordered=false) {
  const tag = ordered ? 'ol' : 'ul';
  const lis = items.map(item => `<li style="margin:0 0 8px;color:${PALETTE.light.body};font-size:${SIZES.body};line-height:1.85;font-family:${FONT_STACK};">${escapeHtml(item)}</li>`).join('');
  return `<tr><td class="e-pad" style="padding:0 32px 16px;">
    <${tag} class="e-list" style="margin:0;padding:0 18px 0 0;color:${PALETTE.light.body};font-size:${SIZES.body};line-height:1.85;font-family:${FONT_STACK};">${lis}</${tag}>
  </td></tr>`;
}
function renderDiffTable(rows) {
  const rowsHtml = rows.map((r, i) => {
    const isLast = i === rows.length - 1;
    const oldHtml = r.ltr ? ltrSpan(r.oldValue) : escapeHtml(r.oldValue);
    const newHtml = r.ltr ? ltrSpan(r.newValue) : escapeHtml(r.newValue);
    const cellBorder = isLast ? '' : `border-bottom:1px solid ${PALETTE.light.divider};`;
    return `<tr>
      <td class="e-mute df-label" valign="top" style="padding:12px 16px;color:${PALETTE.light.muted};font-size:${SIZES.small};font-family:${FONT_STACK};white-space:nowrap;${cellBorder}">${escapeHtml(r.label)}</td>
      <td class="df-old" valign="top" style="padding:12px 8px;color:${DIFF.oldLight};font-size:${SIZES.body};text-decoration:line-through;text-decoration-thickness:2px;font-family:${FONT_STACK};${cellBorder}">${oldHtml}</td>
      <td class="df-new" valign="top" style="padding:12px 16px;color:${DIFF.newLight};font-size:${SIZES.body};font-weight:700;font-family:${FONT_STACK};${cellBorder}">${newHtml}</td>
    </tr>`;
  }).join('');
  return `<tr><td class="e-pad" style="padding:6px 32px 16px;">
    <table role="presentation" class="e-difftable" width="100%" cellspacing="0" cellpadding="0" border="0"
           style="border:1px solid ${PALETTE.light.border};border-radius:${RADII.control};background:${PALETTE.light.soft};border-collapse:separate;">${rowsHtml}</table>
  </td></tr>`;
}
function renderOtpRow(code) {
  const digits = String(code).split('');
  const cells = digits.map((d, i) => {
    const sep = i < digits.length - 1 ? `<td style="width:8px;font-size:1px;line-height:1px;">&nbsp;</td>` : '';
    return `<td class="otp-cell" align="center" valign="middle"
        style="width:48px;height:56px;background:#eff6ff;border:2px solid #2563eb;border-radius:12px;color:#1d4ed8;font-size:26px;font-weight:800;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;line-height:56px;">${escapeHtml(d)}</td>${sep}`;
  }).join('');
  return `<tr><td class="e-pad" style="padding:6px 32px 22px;" align="center">
    <table role="presentation" class="e-otp" align="center" cellspacing="0" cellpadding="0" border="0" dir="ltr">
      <tr>${cells}</tr>
    </table>
  </td></tr>`;
}
function renderDivider() {
  return `<tr><td class="e-pad" style="padding:0 32px;">
    <div class="e-divider" style="height:1px;line-height:1px;font-size:1px;background:${PALETTE.light.divider};">&nbsp;</div>
  </td></tr>`;
}
function renderCtaButton(text, url, status='info') {
  const c = STATUS_COLORS[status];
  return `<tr><td class="e-pad e-cta" align="center" style="padding:18px 32px 26px;">
    <a href="${escapeHtml(url)}" style="display:inline-block;padding:14px 36px;background:${c.border};color:#ffffff;font-size:15px;font-weight:700;border-radius:${RADII.control};text-decoration:none;font-family:${FONT_STACK};border:1px solid ${c.border};line-height:1;">${escapeHtml(text)}</a>
  </td></tr>`;
}

function renderHero(opts) {
  const c = STATUS_COLORS[opts.status];
  const iconCircle = opts.heroIcon ? `<tr><td class="e-pad" align="center" style="padding:6px 32px 18px;">
    <table role="presentation" align="center" cellspacing="0" cellpadding="0" border="0">
      <tr><td class="e-icon-circle" align="center" valign="middle" width="64" height="64"
        style="width:64px;height:64px;background:${c.iconCircleBgLight};border:1px solid ${c.border};border-radius:999px;font-size:30px;line-height:64px;color:${c.textLight};">${opts.heroIcon}</td></tr>
    </table></td></tr>` : '';
  const greeting = opts.greeting ? `<tr><td class="e-pad" align="center" style="padding:0 32px 8px;">
    <h1 class="e-h1" style="margin:0;color:${PALETTE.light.text};font-size:${SIZES.h1};line-height:1.4;font-weight:800;font-family:${FONT_STACK};text-align:center;">${escapeHtml(opts.greeting)}</h1>
  </td></tr>` : '';
  const intro = opts.intro ? `<tr><td class="e-pad" align="center" style="padding:0 32px 8px;">
    <p class="e-body" style="margin:0;color:${PALETTE.light.body};font-size:${SIZES.body};line-height:1.85;font-family:${FONT_STACK};text-align:center;">${escapeHtml(opts.intro)}</p>
  </td></tr>` : '';
  const introEn = opts.introEn ? `<tr><td class="e-pad" align="center" style="padding:0 32px 12px;">
    <p class="e-mute" dir="ltr" style="margin:0;color:${PALETTE.light.muted};font-size:${SIZES.small};line-height:1.6;font-family:${FONT_STACK};text-align:center;">${escapeHtml(opts.introEn)}</p>
  </td></tr>` : '';

  return `<tr><td class="e-pad" align="center" style="padding:36px 32px 18px;">
    <img class="logo-light" src="${LOGOS.light}" srcset="${LOGOS.light2x} 2x" alt="Half Lens" width="240" height="80"
      style="display:block;border:0;width:240px;max-width:240px;height:auto;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
    <img class="logo-dark" src="${LOGOS.dark}" srcset="${LOGOS.dark2x} 2x" alt="Half Lens" width="240" height="80"
      style="display:none;border:0;width:240px;max-width:240px;height:auto;outline:none;text-decoration:none;mso-hide:all;-ms-interpolation-mode:bicubic;" />
    <div style="margin-top:18px;">
      <span class="e-pill" style="display:inline-block;padding:7px 18px;border-radius:999px;background:${c.pillBgLight};border:1px solid ${c.border};color:${c.textLight};font-size:13px;font-weight:700;letter-spacing:.01em;font-family:${FONT_STACK};">${opts.badge}</span>
    </div>
  </td></tr>${iconCircle}${greeting}${intro}${introEn}`;
}

function renderFooter() {
  const year = new Date().getFullYear();
  return `<tr><td class="e-pad" align="center" style="padding:24px 32px 32px;border-top:1px solid ${PALETTE.light.divider};">
    <p class="e-mute" style="font-size:${SIZES.tiny};color:${PALETTE.light.muted};line-height:1.9;margin:0 0 6px;font-family:${FONT_STACK};">
      <a class="e-link" href="${SITE}" style="color:${PALETTE.light.link};text-decoration:none;margin:0 6px;">الموقع</a>
      <span style="color:${PALETTE.light.subtle};">·</span>
      <a class="e-link" href="${SITE}/privacy-policy" style="color:${PALETTE.light.link};text-decoration:none;margin:0 6px;">سياسة السرّية</a>
      <span style="color:${PALETTE.light.subtle};">·</span>
      <a class="e-link" href="${SITE}/terms-and-conditions" style="color:${PALETTE.light.link};text-decoration:none;margin:0 6px;">الشروط</a>
    </p>
    <p class="e-mute" style="font-size:${SIZES.tiny};color:${PALETTE.light.muted};margin:0;font-family:${FONT_STACK};">&copy; ${year} Half Lens Production — جميع الحقوق محفوظة</p>
  </td></tr>`;
}

function renderSection(s) {
  switch (s.kind) {
    case 'paragraph': return renderParagraph(s.text, s.muted);
    case 'heading':   return renderHeading(s.text);
    case 'infoBox':   return renderInfoBox(s.rows);
    case 'alertBox':  return renderAlertBox(s.text, s.status, s.title);
    case 'list':      return renderList(s.items, s.ordered);
    case 'diffTable': return renderDiffTable(s.rows);
    case 'otpRow':    return renderOtpRow(s.code);
    case 'divider':   return renderDivider();
    case 'rawHtml':   return s.html;
  }
  return '';
}

// ── Builder ───────────────────────────────────────────────────
function buildEmail(input, mode='light') {
  const head = `<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="${mode}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>${escapeHtml(input.subject)}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light dark; }
  body, .e-page { background-color: ${PALETTE.light.pageBg}; }
  .e-card  { background-color: ${PALETTE.light.cardBg}; border:1px solid ${PALETTE.light.border}; }
  .e-h1, .ib-value { color:${PALETTE.light.text}; }
  .e-body  { color:${PALETTE.light.body}; }
  .e-mute, .ib-label, .df-label { color:${PALETTE.light.muted}; }
  .e-divider { background-color:${PALETTE.light.divider}; }
  .e-link  { color:${PALETTE.light.link}; }
  .logo-light { display:block; }
  .logo-dark  { display:none; }

  /* Preview-only: data-mode="dark" simulates @media (prefers-color-scheme: dark) */
  html[data-mode="dark"] body, html[data-mode="dark"] .e-page { background-color:${PALETTE.dark.pageBg} !important; }
  html[data-mode="dark"] .e-card { background-color:${PALETTE.dark.cardBg} !important; border-color:${PALETTE.dark.border} !important; }
  html[data-mode="dark"] .e-h1, html[data-mode="dark"] .ib-value { color:${PALETTE.dark.text} !important; }
  html[data-mode="dark"] .e-body { color:${PALETTE.dark.body} !important; }
  html[data-mode="dark"] .e-mute, html[data-mode="dark"] .ib-label, html[data-mode="dark"] .df-label { color:${PALETTE.dark.muted} !important; }
  html[data-mode="dark"] .e-divider { background-color:${PALETTE.dark.divider} !important; }
  html[data-mode="dark"] .e-link { color:${PALETTE.dark.link} !important; }
  html[data-mode="dark"] .e-infobox, html[data-mode="dark"] .e-difftable { background:${PALETTE.dark.cardBg} !important; border-color:${PALETTE.dark.border} !important; }
  html[data-mode="dark"] .e-alert-info    { background:#0a1838 !important; border-color:#3b82f6 !important; }
  html[data-mode="dark"] .e-alert-success { background:#022c22 !important; border-color:#10b981 !important; }
  html[data-mode="dark"] .e-alert-warning { background:#2a1d05 !important; border-color:#f59e0b !important; }
  html[data-mode="dark"] .e-alert-danger  { background:#2c0a0a !important; border-color:#ef4444 !important; }
  html[data-mode="dark"] .otp-cell { background:#0a1838 !important; border-color:#3b82f6 !important; color:#60a5fa !important; }
  html[data-mode="dark"] .df-old { color:${DIFF.oldDark} !important; }
  html[data-mode="dark"] .df-new { color:${DIFF.newDark} !important; }
  html[data-mode="dark"] .logo-light { display:none !important; }
  html[data-mode="dark"] .logo-dark  { display:block !important; }
  /* Hero pill keeps its light-mode bg colors in dark mode for now (high contrast vs dark card). */

  @media only screen and (max-width: 600px) {
    .e-card { border-radius:0 !important; border-left:0 !important; border-right:0 !important; }
    .e-pad  { padding-left:18px !important; padding-right:18px !important; }
    .e-h1   { font-size:20px !important; }
    .otp-cell { width:40px !important; height:48px !important; font-size:22px !important; line-height:48px !important; }
  }
  a { color:${PALETTE.light.link}; text-decoration:none; }
</style>
</head>`;

  const heroHtml = renderHero({
    badge: input.badge, status: input.status,
    heroIcon: input.heroIcon, greeting: input.greeting,
    intro: input.intro, introEn: input.introEn,
  });
  const sectionsHtml = (input.sections || []).map(renderSection).join('');
  const ctaHtml = input.cta ? renderCtaButton(input.cta.text, input.cta.url, input.status) : '';
  const footerHtml = renderFooter();

  const body = `<body class="e-page" bgcolor="${PALETTE.light.pageBg}" style="margin:0;padding:0;background-color:${PALETTE.light.pageBg};font-family:${FONT_STACK};direction:rtl;">
${preheader(input.preheader || '')}
<table role="presentation" class="e-page" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="${PALETTE.light.pageBg}" style="background-color:${PALETTE.light.pageBg};">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" class="e-card" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="${PALETTE.light.cardBg}"
           style="max-width:600px;background-color:${PALETTE.light.cardBg};border:1px solid ${PALETTE.light.border};border-radius:${RADII.card};border-collapse:separate;overflow:hidden;">
      ${heroHtml}${sectionsHtml}${ctaHtml}${footerHtml}
    </table>
  </td></tr>
</table>
</body></html>`;

  return head + body;
}

// ── Render & toggles ──────────────────────────────────────────
let currentTpl = 'otp';
let currentMode = 'light';
let invertOn = false;

function render() {
  const html = TEMPLATES[currentTpl]();
  const frame = document.getElementById('emailFrame');
  frame.srcdoc = html;
  frame.classList.toggle('invert', invertOn);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTpl = btn.dataset.tpl;
    render();
  });
});
document.getElementById('tgDark').addEventListener('click', (e) => {
  e.currentTarget.classList.toggle('on');
  currentMode = e.currentTarget.classList.contains('on') ? 'dark' : 'light';
  render();
});
document.getElementById('tgInvert').addEventListener('click', (e) => {
  e.currentTarget.classList.toggle('on');
  invertOn = e.currentTarget.classList.contains('on');
  render();
});

render();
</script>
